name: deploy-static-pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:lead-magnet-repro
      - run: npm run check:lead-magnet-committed
      - run: npm run test
      - run: npm run typecheck
      - run: STORE_LIVE=false PAYMENTS_LIVE=false NEWSLETTER_LIVE=false npm run audit:publication
      - run: npm run build:lead-magnet
      - run: STORE_LIVE=false PAYMENTS_LIVE=false NEWSLETTER_LIVE=false npm run build
      - run: npm run check:static
      - run: npm run check:public-artifacts
      - run: test ! -e out/api
      - run: node -e 'const a=require("./audits/publication_history_scan.json"); if(a.portfolio_publication_gate.status!=="PASS") process.exit(1)'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: out}
      - id: deployment
        uses: actions/deploy-pages@v4
